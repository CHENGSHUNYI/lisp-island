<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鄭霸的LISP分類島導覽</title>
<meta name="description" content="鄭霸的LISP分類島導覽：依分類瀏覽、搜尋近兩千支 LISP 指令，查看說明、操作方式並下載 .fas。">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<header class="topbar">
  <div class="brand" role="button" tabindex="0" id="homeBtn" title="回到全島地圖">
    <span class="logo">🏝️</span>
    <div>
      <h1>鄭霸的LISP分類島導覽</h1>
      <p id="stats"></p>
    </div>
  </div>
  <div class="search">
    <span aria-hidden="true">🔍</span>
    <input id="q" type="search" placeholder="搜尋指令、檔名、功能說明…" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <div class="sound-wrap">
    <button class="ghost" id="soundBtn" hidden aria-label="音樂與音效音量" aria-haspopup="true" aria-expanded="false">🔊</button>
    <div id="soundPanel" hidden role="group" aria-label="音量">
      <label><span>🎵 音樂</span><input type="range" id="volMusic" min="0" max="100" step="1"><b id="volMusicV"></b></label>
      <label><span>🔔 音效</span><input type="range" id="volSfx" min="0" max="100" step="1"><b id="volSfxV"></b></label>
      <button type="button" id="muteBtn"></button>
    </div>
  </div>
  <select id="themeSel" class="ghost" aria-label="切換情境" title="切換情境"></select>
  <button class="ghost" id="viewBtn" hidden title="切換 2D / 3D 地圖">2D</button>
  <button class="ghost" id="legendBtn">判定標準</button>
</header>

<main>
  <div class="map-wrap">
    <svg id="map" viewBox="0 0 1600 1100" role="img" aria-label="LISP 分類島嶼地圖">
      <defs>
        <radialGradient id="sea" cx="50%" cy="45%" r="75%">
          <stop offset="0" stop-color="#5cc3c0"/>
          <stop offset="1" stop-color="#1d7f95"/>
        </radialGradient>
        <pattern id="waves" width="80" height="40" patternUnits="userSpaceOnUse">
          <path d="M0 20 Q10 14 20 20 T40 20" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
        </pattern>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#021624" flood-opacity=".45"/>
        </filter>
      </defs>
      <rect x="-2000" y="-2000" width="5600" height="5100" fill="url(#sea)"/>
      <rect x="-2000" y="-2000" width="5600" height="5100" fill="url(#waves)"/>
      <g id="islands"></g>
    </svg>
    <p class="hint" id="hint">點選島嶼進入分類 · 共 <b id="catCount"></b> 座島</p>
  </div>

  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel-head">
      <button class="icon" id="closePanel" aria-label="關閉">✕</button>
      <h2 id="panelTitle"></h2>
      <p id="panelSub"></p>
      <div class="filters">
        <label>難易度
          <select id="fLevel">
            <option value="">全部</option>
            <option value="1-3">入門 1–3</option>
            <option value="4-6">中階 4–6</option>
            <option value="7-9">進階 7–9</option>
          </select>
        </label>
        <label>LT 2024+
          <select id="fLt">
            <option value="">全部</option>
            <option value="✅">✅ 支援</option>
            <option value="⚠️">⚠️ 部分</option>
            <option value="❌">❌ 不支援</option>
            <option value="❓">❓ 未知</option>
          </select>
        </label>
        <label>排序
          <select id="fSort">
            <option value="no">序號</option>
            <option value="cmd">指令名稱</option>
            <option value="level">難易度</option>
          </select>
        </label>
        <label class="chk"><input type="checkbox" id="fFas"> 只看可下載</label>
      </div>
    </div>
    <ul class="cards" id="cards"></ul>
    <button class="more" id="more" hidden>顯示更多</button>
  </aside>
</main>

<dialog id="detail">
  <article>
    <button class="icon close" data-close aria-label="關閉">✕</button>
    <div id="detailBody"></div>
  </article>
</dialog>

<dialog id="legend">
  <article>
    <button class="icon close" data-close aria-label="關閉">✕</button>
    <h2>判定標準</h2>
    <div id="legendBody"></div>
  </article>
</dialog>

<script src="data.js"></script>
<script src="audio.js?v=9"></script>
<script src="themes.js?v=7"></script>
<script src="app.js?v=10"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="map3d.js?v=7"></script>
</body>
</html>
